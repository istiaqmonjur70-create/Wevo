<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Checker Pro</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: #9ca3af;
      font-size: 14px;
    }

    .card {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #urlInput {
      flex: 1;
      min-width: 0;
      background: #0b1220;
      color: #fff;
      border: 1px solid #344155;
      border-radius: 12px;
      padding: 14px;
      outline: none;
      font-size: 15px;
    }

    #urlInput:focus {
      border-color: #3b82f6;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: .92;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-success {
      background: #16a34a;
      color: #fff;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-dark {
      background: #273449;
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: #0b1220;
      border: 1px solid #273449;
      border-radius: 14px;
      padding: 16px;
    }

    .stat-title {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: bold;
      word-break: break-word;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tab {
      background: #273449;
      color: #fff;
    }

    .tab.active {
      background: #2563eb;
    }

    .content-box {
      display: none;
    }

    .content-box.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #fff;
    }

    #sourceCode {
      width: 100%;
      height: 600px;
      resize: vertical;
      background: #050914;
      color: #d1d5db;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 15px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #0b1220;
      color: #9ca3af;
      display: none;
    }

    .status.show {
      display: block;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      padding: 15px;
    }

    @media (max-width: 700px) {
      .input-area {
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      iframe,
      #sourceCode {
        height: 500px;
      }

      .header h1 {
        font-size: 25px;
      }
    }
  </style></head><body><div class="container">  <div class="header">
    <h1>🌐 Website Checker Pro</h1>
    <p>Check website status, preview pages and view HTML source</p>
  </div>  <div class="card"><div class="input-area">
  <input
    type="url"
    id="urlInput"
    placeholder="https://example.com"
    autocomplete="off"
  >

  <button class="btn-primary" onclick="checkWebsite()">
    🔍 Check
  </button>

  <button class="btn-danger" onclick="clearAll()">
    ✕ Clear
  </button>
</div>

<div id="statusMessage" class="status"></div>

  </div>  <div class="card"><div class="stats">

  <div class="stat">
    <div class="stat-title">WEBSITE</div>
    <div class="stat-value" id="websiteStatus">—</div>
  </div>

  <div class="stat">
    <div class="stat-title">HTTP STATUS</div>
    <div class="stat-value" id="httpStatus">—</div>
  </div>

  <div class="stat">
    <div class="stat-title">HTML SIZE</div>
    <div class="stat-value" id="htmlSize">—</div>
  </div>

</div>

  </div>  <div class="card"><div class="tabs">

  <button
    class="tab active"
    id="previewTab"
    onclick="showTab('preview')">
    👁 Preview
  </button>

  <button
    class="tab"
    id="sourceTab"
    onclick="showTab('source')">
    &lt;/&gt; View Source
  </button>

</div>

<div id="previewBox" class="content-box active">

  <iframe
    id="previewFrame"
    sandbox="allow-scripts allow-forms allow-popups allow-modals">
  </iframe>

</div>

<div id="sourceBox" class="content-box">

  <textarea
    id="sourceCode"
    readonly
    placeholder="HTML source will appear here...">
  </textarea>

  <div class="actions">

    <button class="btn-success" onclick="copySource()">
      📋 Copy Code
    </button>

    <button class="btn-primary" onclick="downloadHTML()">
      ⬇ Download index.html
    </button>

    <button class="btn-dark" onclick="showTab('preview')">
      👁 Preview
    </button>

  </div>

</div>

  </div>  <div class="card"><div class="actions">

  <button class="btn-primary" onclick="openWebsite()">
    🌐 Open Website
  </button>

  <button class="btn-dark" onclick="refreshPreview()">
    🔄 Refresh Preview
  </button>

</div>

  </div>  <div class="footer">
    Website Checker Pro • Powered by Render
  </div></div><script>

  /* ==============================
     RENDER BACKEND URL
  ============================== */

  const API_BASE = "https://wevo-j2gp.onrender.com";


  let currentURL = "";
  let currentHTML = "";


  function showStatus(message, type = "normal") {

    const box = document.getElementById("statusMessage");

    box.textContent = message;
    box.classList.add("show");

    if (type === "error") {
      box.style.color = "#fca5a5";
    } else {
      box.style.color = "#9ca3af";
    }
  }


  function hideStatus() {

    document
      .getElementById("statusMessage")
      .classList.remove("show");

  }


  function normalizeURL(url) {

    url = url.trim();

    if (!url) {
      return "";
    }

    if (!/^https?:\/\//i.test(url)) {
      url = "https://" + url;
    }

    return url;
  }


  async function checkWebsite() {

    let url = document
      .getElementById("urlInput")
      .value
      .trim();

    if (!url) {

      showStatus(
        "Please enter a website URL.",
        "error"
      );

      return;
    }

    url = normalizeURL(url);

    try {

      new URL(url);

    } catch {

      showStatus(
        "Invalid website URL.",
        "error"
      );

      return;
    }


    currentURL = url;

    showStatus("⏳ Checking website...");


    try {

      const response = await fetch(
        API_BASE +
        "/api/fetch?url=" +
        encodeURIComponent(url)
      );


      const data = await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.error || "Unable to fetch website."
        );

      }


      currentHTML = data.html || "";


      document.getElementById("websiteStatus")
        .textContent =
        data.finalUrl || url;


      document.getElementById("httpStatus")
        .textContent =
        data.status || "—";


      document.getElementById("htmlSize")
        .textContent =
        formatBytes(
          new Blob([currentHTML]).size
        );


      document.getElementById("sourceCode")
        .value = currentHTML;


      document.getElementById("previewFrame")
        .src =
        API_BASE +
        "/api/preview?url=" +
        encodeURIComponent(url);


      showStatus(
        "✅ Website checked successfully."
      );

    } catch (error) {

      console.error(error);

      showStatus(
        "❌ " + error.message,
        "error"
      );

      document.getElementById("websiteStatus")
        .textContent = "Error";

      document.getElementById("httpStatus")
        .textContent = "—";

      document.getElementById("htmlSize")
        .textContent = "—";

    }

  }


  function formatBytes(bytes) {

    if (!bytes) {
      return "0 B";
    }

    const units = [
      "B",
      "KB",
      "MB",
      "GB"
    ];

    let i = 0;

    while (
      bytes >= 1024 &&
      i < units.length - 1
    ) {

      bytes /= 1024;
      i++;

    }

    return bytes.toFixed(2) + " " + units[i];

  }


  function showTab(tab) {

    const previewBox =
      document.getElementById("previewBox");

    const sourceBox =
      document.getElementById("sourceBox");

    const previewTab =
      document.getElementById("previewTab");

    const sourceTab =
      document.getElementById("sourceTab");


    if (tab === "preview") {

      previewBox.classList.add("active");
      sourceBox.classList.remove("active");

      previewTab.classList.add("active");
      sourceTab.classList.remove("active");

    } else {

      sourceBox.classList.add("active");
      previewBox.classList.remove("active");

      sourceTab.classList.add("active");
      previewTab.classList.remove("active");

    }

  }


  async function copySource() {

    if (!currentHTML) {

      showStatus(
        "No HTML source available.",
        "error"
      );

      return;
    }


    try {

      await navigator.clipboard.writeText(
        currentHTML
      );

      showStatus(
        "✅ HTML source copied successfully."
      );

    } catch {

      const textarea =
        document.getElementById("sourceCode");

      textarea.select();

      document.execCommand("copy");

      showStatus(
        "✅ HTML source copied."
      );

    }

  }


  function downloadHTML() {

    if (!currentHTML) {

      showStatus(
        "No HTML source available.",
        "error"
      );

      return;
    }


    const blob = new Blob(
      [currentHTML],
      {
        type: "text/html;charset=utf-8"
      }
    );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;
    link.download = "index.html";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);


    showStatus(
      "⬇ index.html downloaded."
    );

  }


  function openWebsite() {

    if (!currentURL) {

      showStatus(
        "Please check a website first.",
        "error"
      );

      return;
    }


    window.open(
      currentURL,
      "_blank"
    );

  }


  function refreshPreview() {

    if (!currentURL) {

      showStatus(
        "Please check a website first.",
        "error"
      );

      return;
    }


    const frame =
      document.getElementById("previewFrame");


    frame.src =
      API_BASE +
      "/api/preview?url=" +
      encodeURIComponent(currentURL);


    showStatus(
      "🔄 Preview refreshed."
    );

  }


  function clearAll() {

    currentURL = "";
    currentHTML = "";


    document.getElementById("urlInput")
      .value = "";


    document.getElementById("sourceCode")
      .value = "";


    document.getElementById("previewFrame")
      .src = "about:blank";


    document.getElementById("websiteStatus")
      .textContent = "—";


    document.getElementById("httpStatus")
      .textContent = "—";


    document.getElementById("htmlSize")
      .textContent = "—";


    hideStatus();

    showTab("preview");

  }


  document
    .getElementById("urlInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          checkWebsite();
        }

      }
    );

</script></body>
</html>
